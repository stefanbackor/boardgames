    <!-- Google tag (gtag.js) with Consent Mode v2 -->
    <script
      async
      type="text/javascript"
      src="https://www.googletagmanager.com/gtag/js?id=G-F6EHG1F8KP"
    ></script>
    <script type="text/javascript">
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }

      // Deny all storage by default until the user opts in via the consent banner.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      })

      // Re-apply a previously granted choice before GA initialises.
      try {
        if (localStorage.getItem('botc-cookie-consent') === 'granted') {
          gtag('consent', 'update', { analytics_storage: 'granted' })
        }
      } catch (e) {
        /* localStorage unavailable — stay denied */
      }

      gtag('js', new Date())
      gtag('config', 'G-F6EHG1F8KP')
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Fonts (Inter + Sorts Mill Goudy) are self-hosted via @font-face in src/styles.css -->

    <link
